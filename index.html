
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Accessibility Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 750px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
      color: #222;
    }

    h1 {
      color: #174a7e;
    }

    button {
      padding: 12px 20px;
      background: #174a7e;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 12px;
    }

    input {
      margin-top: 15px;
    }

    #report {
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .issue {
      color: #9b1c1c;
    }

    .pass {
      color: #176b35;
    }
  </style>
</head>
<body>

  <h1>Word Accessibility Checker</h1>

  <p>
    Upload a Word document to identify potential
    accessibility issues that require manual review.
  </p>

  <input type="file" id="document" accept=".docx">

  <br>

  <button onclick="checkDocument()">
    Check Document
  </button>

  <div id="report" aria-live="polite">
    <h2>Accessibility Report</h2>
    <p>Your report will appear here.</p>
  </div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
 <script>
async function checkDocument() {
  alert("The button is working!");

  const file = document.getElementById("document").files[0];
  const report = document.getElementById("report");

  if (!file) {
    report.innerHTML =
      "<h2>Accessibility Report</h2>" +
      "<p>Please select a Word document first.</p>";
    return;
  }

  if (!file.name.toLowerCase().endsWith(".docx")) {
    report.innerHTML =
      "<h2>Accessibility Report</h2>" +
      "<p>Please select a .docx Word document.</p>";
    return;
  }

  report.innerHTML = "<p>Analyzing your document...</p>";

  try {
    const zip = await JSZip.loadAsync(file);
    const documentFile = zip.file("word/document.xml");
    const stylesFile = zip.file("word/styles.xml");
    const propertiesFile = zip.file("docProps/core.xml");

    if (!documentFile) {
      throw new Error("The Word document could not be read.");
    }

    const parser = new DOMParser();
    const xml = await documentFile.async("text");
    const doc = parser.parseFromString(xml, "application/xml");

    const paragraphs = Array.from(doc.getElementsByTagName("w:p"));
    const headings = paragraphs.filter(p => {
      const style = p.getElementsByTagName("w:pStyle")[0];
      return style && /^Heading[1-6]$/i.test(style.getAttribute("w:val") || "");
    });

    const images = Array.from(doc.getElementsByTagName("wp:docPr"));
    const missingAlt = images.filter(img => {
      return !(img.getAttribute("descr") || "").trim();
    });

    const links = Array.from(doc.getElementsByTagName("w:hyperlink"));
    const emptyLinks = links.filter(link => !link.textContent.trim());
    const tables = doc.getElementsByTagName("w:tbl");

    let titleFound = false;
    let languageFound = false;

    if (propertiesFile) {
      const xml = await propertiesFile.async("text");
      const props = parser.parseFromString(xml, "application/xml");
      const title = props.getElementsByTagName("dc:title")[0];
      titleFound = !!(title && title.textContent.trim());
    }

    if (stylesFile) {
      const xml = await stylesFile.async("text");
      languageFound = /w:lang[^>]*w:val=["'][^"']+["']/.test(xml);
    }

    const findings = [];

    findings.push(headings.length
      ? headings.length + " heading(s) detected. Review heading order."
      : "No heading styles detected. Review document structure.");

    findings.push(missingAlt.length
      ? missingAlt.length + " image(s) may be missing alternative text."
      : images.length
        ? "Alternative text descriptions were detected for images."
        : "No images were detected.");

    findings.push(emptyLinks.length
      ? emptyLinks.length + " hyperlink(s) may be missing text."
      : "No empty hyperlinks were detected.");

    findings.push(tables.length
      ? tables.length + " table(s) detected. Manually review table headers and structure."
      : "No tables were detected.");

    findings.push(titleFound
      ? "Document title metadata was detected."
      : "Document title metadata may be missing.");

    findings.push(languageFound
      ? "Document language metadata was detected."
      : "Document language metadata may be missing.");

    report.innerHTML = "<h2>Accessibility Report</h2>";

    const name = document.createElement("p");
    name.textContent = "Document: " + file.name;
    report.appendChild(name);

    const heading = document.createElement("h3");
    heading.textContent = "Issues and items to review";
    report.appendChild(heading);

    const list = document.createElement("ul");

    findings.forEach(finding => {
      const item = document.createElement("li");
      item.textContent = finding;
      list.appendChild(item);
    });

    report.appendChild(list);

    const reminder = document.createElement("p");
    reminder.textContent =
      "This is a preliminary automated review, not a WCAG compliance certification. A communication professional must manually review and correct the document.";
    report.appendChild(reminder);

  } catch (error) {
    report.innerHTML = "<h2>Accessibility Checker Error</h2>";
    const message = document.createElement("p");
    message.textContent = error.message;
    report.appendChild(message);
  }
}
</script>

</body>
</html>
