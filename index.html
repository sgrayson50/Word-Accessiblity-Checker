
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Accessibility Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 750px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
      color: #222;
    }

    h1 {
      color: #174a7e;
    }

    button {
      padding: 12px 20px;
      background: #174a7e;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 12px;
    }

    input {
      margin-top: 15px;
    }

    #report {
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .issue {
      color: #9b1c1c;
    }

    .pass {
      color: #176b35;
    }
  </style>
</head>
<body>

  <h1>Word Accessibility Checker</h1>

  <p>
    Upload a Word document to identify potential
    accessibility issues that require manual review.
  </p>

  <input type="file" id="document" accept=".docx">

  <br>

  <button onclick="checkDocument()">
    Check Document
  </button>

  <div id="report" aria-live="polite">
    <h2>Accessibility Report</h2>
    <p>Your report will appear here.</p>
  </div>

  <script>
    function async function checkDocument() <script>
  const file = document.getElementById("document").files[0];
  const report = document.getElementById("report");

  if (!file) {
    report.innerHTML =
      "<h2>Accessibility Report</h2>" +
      "<p>Please select a Word document first.</p>";
    return;
  }

  report.innerHTML =
    "<h2>Accessibility Report</h2>" +
    "<p>Analyzing your document...</p>";

  try {
    const zip = await JSZip.loadAsync(file);

    const documentFile = zip.file("word/document.xml");
    const stylesFile = zip.file("word/styles.xml");
    const propertiesFile = zip.file("docProps/core.xml");

    if (!documentFile) {
      throw new Error("The Word document could not be read.");
    }

    const documentXML = await documentFile.async("text");
    const parser = new DOMParser();
    const doc = parser.parseFromString(
      documentXML,
      "application/xml"
    );

    const paragraphs = Array.from(
      doc.getElementsByTagName("w:p")
    );

    const headings = paragraphs.filter(paragraph => {
      const style = paragraph.getElementsByTagName("w:pStyle")[0];
      return style &&
        /^Heading[1-6]$/i.test(
          style.getAttribute("w:val") || ""
        );
    });

    const images = Array.from(
      doc.getElementsByTagName("wp:docPr")
    );

    const imagesWithoutAlt = images.filter(image => {
      const description = image.getAttribute("descr");
      return !description || !description.trim();
    });

    const links = Array.from(
      doc.getElementsByTagName("w:hyperlink")
    );

    const linksWithoutText = links.filter(link => {
      return !link.textContent.trim();
    });

    const tables = doc.getElementsByTagName("w:tbl");

    let titleFound = false;
    let languageFound = false;

    if (propertiesFile) {
      const propertiesXML = await propertiesFile.async("text");
      const properties = parser.parseFromString(
        propertiesXML,
        "application/xml"
      );

      const title = properties.getElementsByTagName("dc:title")[0];

      titleFound = title && title.textContent.trim().length > 0;
    }

    if (stylesFile) {
      const stylesXML = await stylesFile.async("text");
      languageFound = /w:lang[^>]*w:val=["'][^"']+["']/.test(
        stylesXML
      );
    }

    const findings = [];

    if (headings.length === 0) {
      findings.push(
        "No heading styles were detected. Review the document structure."
      );
    } else {
      findings.push(
        headings.length + " heading(s) detected. Review heading order."
      );
    }

    if (imagesWithoutAlt.length > 0) {
      findings.push(
        imagesWithoutAlt.length +
        " image(s) may be missing alternative text."
      );
    } else if (images.length > 0) {
      findings.push(
        "Alternative text descriptions were detected for the images."
      );
    } else {
      findings.push(
        "No images were detected in the document."
      );
    }

    if (linksWithoutText.length > 0) {
      findings.push(
        linksWithoutText.length +
        " hyperlink(s) may have missing text."
      );
    } else {
      findings.push(
        "No empty hyperlinks were detected."
      );
    }

    if (tables.length > 0) {
      findings.push(
        tables.length +
        " table(s) detected. Manually review table headers and structure."
      );
    } else {
      findings.push("No tables were detected.");
    }

    if (!titleFound) {
      findings.push(
        "Document title metadata may be missing."
      );
    } else {
      findings.push("Document title metadata was detected.");
    }

    if (!languageFound) {
      findings.push(
        "Document language metadata may be missing."
      );
    } else {
      findings.push("Document language metadata was detected.");
    }

    report.innerHTML =
      "<h2>Accessibility Report</h2>";

    const fileName = document.createElement("p");
    fileName.textContent = "Document: " + file.name;
    report.appendChild(fileName);

    const heading = document.createElement("h3");
    heading.textContent = "Issues and items to review";
    report.appendChild(heading);

    const list = document.createElement("ul");

    findings.forEach(finding => {
      const item = document.createElement("li");
      item.textContent = finding;
      list.appendChild(item);
    });

    report.appendChild(list);

    const reminder = document.createElement("p");
    reminder.textContent =
      "This is a preliminary automated review, not a WCAG " +
      "compliance certification. A communication professional " +
      "must manually review and correct the document.";
    report.appendChild(reminder);

  } catch (error) {
    report.innerHTML =
      "<h2>Accessibility Report</h2>" +
      "<p>The document could not be analyzed. " +
      "Please check that it is a valid .docx file.</p>";
  }
}
      const file = document.getElementById("document").files[0];
      const report = document.getElementById("report");

      if (!file) {
        report.innerHTML =
          "<h2>Accessibility Report</h2>" +
          "<p class='issue'>Please select a Word document first.</p>";
        return;
      }

      if (!file.name.toLowerCase().endsWith(".docx")) {
        report.innerHTML =
          "<h2>Accessibility Report</h2>" +
          "<p class='issue'>Please select a .docx Word document.</p>";
        return;
      }

      report.innerHTML =
        "<h2>Accessibility Report</h2>" +
        "<p><strong>Document:</strong> " + file.name + "</p>" +
        "<p class='pass'>Your document was selected successfully.</p>" +
        "<p>Full accessibility checks will be added in the next step.</p>" +
        "<p><strong>Remember:</strong> A communication professional " +
        "must review and correct accessibility issues manually.</p>";
    }
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  </script>

</body>
</html>
