
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Accessibility Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 750px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
      color: #222;
    }

    h1 {
      color: #174a7e;
    }

    button {
      padding: 12px 20px;
      background: #174a7e;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 12px;
    }

    input {
      margin-top: 15px;
    }

    #report {
      margin-top: 25px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .issue {
      color: #9b1c1c;
    }

    .pass {
      color: #176b35;
    }
  </style>
</head>
<body>

  <h1>Word Accessibility Checker</h1>

  <p>
    Upload a Word document to identify potential
    accessibility issues that require manual review.
  </p>

  <input type="file" id="document" accept=".docx">

  <br>

  <button onclick="checkDocument()">
    Check Document
  </button>

  <div id="report" aria-live="polite">
    <h2>Accessibility Report</h2>
    <p>Your report will appear here.</p>
  </div>

  <script>
    function checkDocument() {
      const file = document.getElementById("document").files[0];
      const report = document.getElementById("report");

      if (!file) {
        report.innerHTML =
          "<h2>Accessibility Report</h2>" +
          "<p class='issue'>Please select a Word document first.</p>";
        return;
      }

      if (!file.name.toLowerCase().endsWith(".docx")) {
        report.innerHTML =
          "<h2>Accessibility Report</h2>" +
          "<p class='issue'>Please select a .docx Word document.</p>";
        return;
      }

      report.innerHTML =
        "<h2>Accessibility Report</h2>" +
        "<p><strong>Document:</strong> " + file.name + "</p>" +
        "<p class='pass'>Your document was selected successfully.</p>" +
        "<p>Full accessibility checks will be added in the next step.</p>" +
        "<p><strong>Remember:</strong> A communication professional " +
        "must review and correct accessibility issues manually.</p>";
    }
  </script>

</body>
</html>
